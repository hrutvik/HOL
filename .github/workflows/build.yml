name: Build HOL4
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  HOLDIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    permissions:
      contents: read

    steps:
      - name: Install build-essentials
        run: |
          apt-get update
          apt-get install -y build-essential gcc-10 libffi-dev
      - name: Checkout Poly/ML
        uses: actions/checkout@v2
        with:
          repository: polyml/polyml
          ref: fixes-5.9
          path: polyml

      - name: Build Poly/ML
        run: |
          cd polyml
          ./configure --prefix=/usr
          make
          make install

      - name: Checkout HOL4
        uses: actions/checkout@v3

      - name: Configure HOL4
        run: |
          cd $HOLDIR
          poly < tools/smart-configure.sml

      - name: Build HOL4
        run: |
          cd $HOLDIR
          bin/build
